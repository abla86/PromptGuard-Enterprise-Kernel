name: Security Dependency Audit
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Audit npm projects
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r package; do
            found=1
            dir="$(dirname "$package")"
            npm install --package-lock-only --ignore-scripts --no-audit --prefix "$dir"
            npm audit --audit-level=high --prefix "$dir" || { code=$?; echo "npm audit returned $code; rerunning as JSON to distinguish audit findings from npm exit anomalies."; npm audit --json --prefix "$dir" > "$RUNNER_TEMP/npm-audit.json" || true; node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8")); const v=j.metadata?.vulnerabilities||{}; if ((v.high||0)+(v.critical||0)>0) process.exit(1); console.log("No high/critical vulnerabilities reported.");'; }
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print)
          if [ "$found" -eq 0 ]; then echo "No npm projects found."; fi
